<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>CA Foundation — AIR Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f6fa;
  --card:#ffffff; --line:#eef0f5; --line-soft:#eef0f5;
  --text:#171923; --muted:#8a8fa3; --faint:#c7cbd6;
  --brand:#22c55e; --brand-soft:#e8faf0; --brand-dark:#16a34a;
  --law:#0d9488; --law-soft:#e6f6f4;
  --eco:#d97706; --eco-soft:#fdf1e0;
  --acc:#2563eb; --acc-soft:#e8f0fe;
  --qa:#9333ea; --qa-soft:#f4e9fd;
  --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --flame1:#ff8a3d; --flame2:#ff4d4d;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(23,25,35,.04),0 6px 18px rgba(23,25,35,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0}
p{margin:0}
a{color:inherit}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:250px;flex:0 0 250px;background:var(--card);border-right:1px solid var(--line);
  padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--brand),var(--brand-dark));color:#fff;font-weight:800;font-size:13px;flex:0 0 auto}
.brand b{display:block;font-size:14.5px;font-weight:700}
.brand small{color:var(--muted);font-size:10.5px}
.navlabel{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);padding:14px 10px 8px;text-transform:uppercase}
.navlabel:first-of-type{padding-top:2px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  color:#5b6072;font-weight:600;font-size:13px;padding:9px 10px;border-radius:10px;margin-bottom:2px;transition:.15s}
.navbtn:hover{background:#f4f5f9}
.navbtn.active{background:var(--brand-soft);color:var(--brand-dark)}
.navbtn .ic{font-size:15px;width:18px;text-align:center}

.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:#f5f6faee;backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;padding:18px 26px;border-bottom:1px solid var(--line-soft)}
.topbar h2{font-size:17px;font-weight:700}
.topright{display:flex;align-items:center;gap:10px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;font-size:15px;color:#5b6072}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:9px;font-weight:800;
  min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:5px 10px 5px 5px}
.avatar{width:28px;height:28px;border-radius:9px;background:linear-gradient(145deg,var(--qa),var(--acc));color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:800}
.who b{font-size:12px;font-weight:700}
.who span{display:block;font-size:9.5px;color:var(--muted)}

.content{padding:18px 26px 100px}
.tabs{display:none}
.bottomnav{display:none}

/* ---------- generic card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.section{padding:18px 20px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:13px;flex-wrap:wrap}
.head h3{font-size:14.5px;font-weight:700}
.head span{font-size:11px;color:var(--muted)}

/* ---------- pass / rank gauge row ---------- */
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.hero-gauge{padding:20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-gauge h3{font-size:14.5px;font-weight:700;align-self:flex-start}
.hero-gauge span.sub{align-self:flex-start;font-size:11px;color:var(--muted);margin-top:1px}
.arcwrap{position:relative;width:190px;height:148px;margin-top:4px}
.arcnum{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:34px;font-weight:800}
.arctag{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:9.5px;font-weight:800;
  letter-spacing:.06em;color:var(--muted)}
.slogan{margin-top:8px;font-size:12px;font-weight:750;line-height:1.45;padding:10px 13px;border-radius:12px;width:100%}
.slogan.great{background:#eafbf1;color:#15803d}
.slogan.ok{background:#eaf1ff;color:#1d4ed8}
.slogan.risk{background:#fff6e6;color:#b45309}
.slogan.fail{background:#fdecec;color:#b91c1c}

/* ---------- today performance card ---------- */
.todaycard{margin-bottom:14px}
.trackbar{height:13px;background:#eef0f5;border-radius:99px;overflow:hidden;margin:11px 0 10px}
.trackbar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.ticker-line{font-size:13px;font-weight:800;min-height:18px;transition:opacity .22s ease}
.ticker-line.fire{color:#15803d}
.ticker-line.good{color:#1d4ed8}
.ticker-line.meh{color:#b45309}
.ticker-line.bad{color:#b91c1c}

/* ---------- mini stat lists ---------- */
.statlistrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.statlist{display:flex;flex-direction:column;gap:0}
.statlist .row{display:flex;align-items:center;gap:11px;padding:11px 2px}
.statlist .row + .row{border-top:1px solid var(--line-soft)}
.chip{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.rowtext{flex:1;min-width:0}
.rowtext b{display:block;font-size:12.5px;font-weight:700}
.rowtext span{display:block;font-size:10px;color:var(--muted);margin-top:1px}
.ring{position:relative;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ringnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}

/* ---------- two column grid ---------- */
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- timetable list ---------- */
.tlist{display:flex;flex-direction:column;gap:9px}
.trow{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;
  padding:10px;border:1px solid var(--line-soft);border-radius:13px;transition:.15s}
.trow.done{opacity:.55}
.tavatar{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:16px;color:#fff;font-weight:700}
.tname{font-size:12.5px;font-weight:700}
.tname.strike{text-decoration:line-through}
.ttag{display:inline-block;margin-top:3px;font-size:9.5px;font-weight:750;padding:2px 8px;border-radius:99px}
.ttime{font-size:10.5px;color:var(--muted);font-weight:650;white-space:nowrap;text-align:right}
.tbtn{border:none;border-radius:9px;padding:7px 13px;font-size:11px;font-weight:750;white-space:nowrap;color:#fff}
.tbtn.mark{background:var(--brand)}
.tbtn.done{background:#eef0f5;color:var(--muted)}

/* ---------- subjects table ---------- */
.subtable{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:44px 1.4fr 1fr auto auto 18px;gap:12px;align-items:center;
  padding:11px 10px;border-radius:13px;border:1px solid var(--line-soft);cursor:pointer;transition:.15s}
.srow:hover{border-color:#dfe2ea;background:#fafbfd}
.savatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
.sname{font-size:12.5px;font-weight:700}
.smeta{font-size:9.5px;color:var(--muted);margin-top:2px}
.sprog{height:8px;background:#eef0f5;border-radius:99px;overflow:hidden;min-width:70px}
.sprog i{display:block;height:100%;border-radius:99px}
.sscore{font-size:12px;font-weight:750;text-align:right}
.pill{font-size:9.5px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.prog{background:#fff4e0;color:#b45309}
.pill.done{background:var(--brand-soft);color:#15803d}
.chev{color:var(--faint);font-size:13px;text-align:right}

/* ---------- streak card ---------- */
.streakcard{padding:20px 20px 18px}
.streaktop{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.streakflame{font-size:38px;line-height:1;filter:drop-shadow(0 4px 10px rgba(255,120,50,.35))}
.streaknum{font-size:34px;font-weight:800;line-height:1}
.streaknum small{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:3px}
.streakrec{font-size:10.5px;color:var(--muted);font-weight:700;text-align:right}
.streakrec b{color:#b45309}
.flamerow{display:flex;justify-content:space-between;gap:6px;margin-top:6px}
.flame{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 2px;border-radius:12px;
  border:1px solid var(--line-soft);background:#fafbfd}
.flame .fi{font-size:19px;line-height:1;opacity:.28;filter:grayscale(1)}
.flame.on{background:linear-gradient(180deg,#fff4ea,#fff);border-color:#ffe0c2}
.flame.on .fi{opacity:1;filter:none;animation:flick 1.6s ease-in-out infinite}
.flame.today.pending .fi{opacity:.5;animation:pulse 1.4s ease-in-out infinite}
.flame span:last-child{font-size:8.5px;color:var(--muted);font-weight:800;text-transform:uppercase}
.flame:nth-child(2) .fi{animation-delay:.1s}
.flame:nth-child(3) .fi{animation-delay:.25s}
.flame:nth-child(4) .fi{animation-delay:.05s}
.flame:nth-child(5) .fi{animation-delay:.3s}
.flame:nth-child(6) .fi{animation-delay:.15s}
.flame:nth-child(7) .fi{animation-delay:.22s}
@keyframes flick{
  0%,100%{transform:translateY(0) scale(1) rotate(-3deg)}
  30%{transform:translateY(-1px) scale(1.07) rotate(2deg)}
  60%{transform:translateY(0.5px) scale(.97) rotate(-2deg)}
}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.12)}}
.streakhint{margin-top:12px;font-size:10.5px;color:var(--muted);line-height:1.5}
.streakhint b{color:var(--text)}

/* ---------- quick log card ---------- */
.loglabel{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:5px;display:block}
.logfield{margin-bottom:10px}
.logfield input{width:100%;border:1px solid var(--line);background:#fafbfd;color:var(--text);
  padding:9px 10px;border-radius:10px;outline:none;font-size:12px}
.logfield input:focus{border-color:var(--acc);background:#fff}
.logstatus{margin-top:10px;padding:10px 12px;border-radius:11px;font-size:11px;font-weight:700}
.logstatus.green{background:var(--brand-soft);color:#15803d}
.logstatus.yellow{background:var(--eco-soft);color:#b45309}
.logstatus.red{background:#fdecec;color:#991b1b}
.btnrow{display:flex;gap:8px;margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 13px;font-size:11.5px;font-weight:750}
.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn.primary:hover{opacity:.88}
.btn.ghost{color:#b91c1c;border-color:#f3d0d0}

/* ---------- practice preview card ---------- */
.pquiz{display:flex;align-items:center;gap:11px;padding:11px 0}
.pquiz+.pquiz{border-top:1px solid var(--line-soft)}
.pqicon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:15px}
.pqtext b{display:block;font-size:12px;font-weight:700}
.pqtext span{font-size:9.5px;color:var(--muted)}
.pqbtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-size:10.5px;font-weight:750}
.seeall{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 11px;font-size:10.5px;font-weight:750}

/* ---------- subject detail page ---------- */
.subjecthero{padding:22px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.subjecthero h2{font-size:22px;margin:4px 0;font-weight:800}
.subjecthero p{font-size:11.5px;color:var(--muted)}
.subbadge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:22px;color:#fff}
.phases{display:flex;gap:5px;width:220px}
.phases i{height:7px;flex:1;background:#eef0f5;border-radius:99px}
.chapters{display:grid;gap:8px}
.chapter{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding:12px;
  border:1px solid var(--line-soft);border-radius:12px;background:#fff}
.chapter input{width:17px;height:17px}
.chapter.done{background:#fafbfd}
.chapter.done .cname{text-decoration:line-through;color:#a6abbb}
.cname{font-size:12px;font-weight:650}
.weight{font-size:9.5px;color:var(--muted);text-align:right}

/* ---------- drawer ---------- */
.menu-overlay{position:fixed;inset:0;background:#00000040;opacity:0;pointer-events:none;transition:.2s;z-index:49}
.menu-overlay.open{opacity:1;pointer-events:auto}
.side-menu{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:90vw;background:#fff;
  border-left:1px solid var(--line);transform:translateX(100%);transition:.28s cubic-bezier(.2,.8,.3,1);
  z-index:50;overflow-y:auto;padding:20px;box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.side-menu.open{transform:translateX(0)}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.side-head b{font-size:15px;font-weight:800}
.side-head button{background:#f4f5f9;border:none;color:#5b6072;font-size:14px;padding:6px 9px;border-radius:9px}
.side-label{font-size:10.5px;color:var(--muted);margin:20px 0 10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.side-label:first-of-type{margin-top:0}
.auth-stack{display:flex;flex-direction:column;gap:8px}
.auth-stack input{width:100%;border:1px solid var(--line);background:#fafbfd;color:var(--text);
  padding:10px;border-radius:10px;font-size:12.5px;outline:none}
.side-actions{display:flex;gap:6px;flex-wrap:wrap}
.side-actions .btn{flex:1;min-width:70px;text-align:center}
.cloudrow{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;color:var(--muted)}
.cloud-dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.cloud-dot.on{background:var(--good)}
.cloud-dot.warn{background:var(--warn)}
.practice-grid{display:flex;flex-direction:column;gap:12px}
.prac{padding:13px 14px;border-radius:14px;border:1px solid var(--line-soft);background:#fafbfd}
.prac .ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.prac .ptop b{font-size:12.5px;font-weight:750}
.prac .ppct{font-size:11px;font-weight:800}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line-soft)}
.prow:first-of-type{border-top:none}
.plabel{font-size:11px;color:#454a5c;font-weight:650}
.ptarget{font-size:9.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:14px;font-weight:800;line-height:1}
.stepper button:active{transform:scale(.92)}
.stepper span{min-width:16px;text-align:center;font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums}

footer{text-align:center;color:var(--faint);font-size:9.5px;margin-top:24px}

@media(max-width:1080px){
  .statrow,.statlistrow{grid-template-columns:1fr;}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:900px){
  .sidebar{display:none}
  .content{padding:14px 14px 92px}
  .topbar{padding:14px 16px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;justify-content:space-around;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(16px);
    border-top:1px solid var(--line)}
  .bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
    color:var(--muted);font-size:9.5px;font-weight:700;padding:4px 8px;border-radius:9px}
  .bottomnav button .ic{font-size:16px;line-height:1}
  .bottomnav button.active{color:var(--brand-dark)}
  .srow{grid-template-columns:38px 1fr auto 16px}
  .sprog,.sscore{display:none}
  .arcwrap{width:160px;height:126px}
  .who span{display:none}
}
@media(prefers-reduced-motion:reduce){.flame.on .fi,.flame.today.pending .fi{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">CA</div><div><b>AIR Tracker</b><small>Foundation · Sep–Oct</small></div></div>
    <div class="navlabel">Main</div>
    <div id="navmain"></div>
    <div class="navlabel">Subjects</div>
    <div id="navsubjects"></div>
    <div class="navlabel">Other</div>
    <button class="navbtn" id="openMenuSide"><span class="ic">⚙️</span>Account &amp; sync</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <h2 id="pageTitle">Home page</h2>
      <div class="topright">
        <button class="iconbtn" id="bellBtn" title="Sessions left today">🔔<span class="badge" id="bellBadge">0</span></button>
        <button class="who" id="openMenuTop"><div class="avatar" id="avatarInit">••</div><div><b id="whoName">Local</b><span id="whoSub">tap to sync</span></div></button>
      </div>
    </header>
    <main class="content" id="app"></main>
  </div>
</div>
<div class="bottomnav" id="bottomnav"></div>

<div class="menu-overlay" id="menuOverlay"></div>
<aside class="side-menu" id="sideMenu">
  <div class="side-head"><b>Account &amp; practice</b><button id="closeMenu">✕</button></div>

  <div class="side-label">Account</div>
  <div class="auth-stack">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="side-actions">
      <button class="btn" id="signup">Sign up</button>
      <button class="btn" id="login">Log in</button>
      <button class="btn" id="logout" style="display:none">Log out</button>
      <button class="btn primary" id="sync" style="display:none">Sync cloud</button>
    </div>
    <div class="cloudrow"><i class="cloud-dot" id="cloudDot"></i><span id="authStatus">Local only</span></div>
  </div>

  <div class="side-label">Exam practice tracker</div>
  <div id="drawerPractice"></div>
</aside>

<script>
/* ============================================================
   SUPABASE CONFIG
   1) Create a Supabase project.
   2) Run the supplied SQL in SQL Editor.
   3) Paste your Project URL and PUBLIC anon/publishable key below.
   NEVER put the service_role/secret key in this HTML.
   ============================================================ */
const SUPABASE_URL = "https://tcfjkovzljrliiyjotxr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bDFR6myjVcd90C_mJ-tPUg_1ElSkrcJ";
const SUPABASE_READY =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_") &&
  !SUPABASE_ANON_KEY.includes("PASTE_");

const sb = SUPABASE_READY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------------- subject + syllabus data (unchanged content) ---------------- */
const S={

}

function slotMinutes(i){
  let [sh,sm]=T[i][0].split(":").map(Number);
  let [eh,em]=T[i][1].split(":").map(Number);
  return (eh*60+em)-(sh*60+sm);
}
function dayHours(dateKey){
  let d=state.logs[dateKey];
  if(!d||!d.slots)return 0;
  let mins=0;
  T.forEach((t,i)=>{ if(d.slots["t"+i]) mins+=slotMinutes(i); });
  return mins/60;
}
function isStreakDay(dateKey){ return dayHours(dateKey)>=STREAK_HOURS_TARGET; }
function currentStreak(){
  let cursor=new Date();
  let todayKey=cursor.toISOString().slice(0,10);
  if(!isStreakDay(todayKey)) cursor.setDate(cursor.getDate()-1);
  let count=0;
  while(true){
    let k=cursor.toISOString().slice(0,10);
    if(isStreakDay(k)){ count++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return count;
}
function totalHoursLogged(){return Object.keys(state.logs).reduce((a,k)=>a+dayHours(k),0)}
function weeklySessionsPct(){

}

/* ---------------- today's performance: negative if behind, positive if on track ---------------- */
function expectedSlotsByNow(){
  let now=new Date(),nowMin=now.getHours()*60+now.getMinutes(),count=0;
  T.forEach(t=>{let [eh,em]=t[1].split(":").map(Number);if(eh*60+em<=nowMin)count++});
  return count;
}
function todayBucket(){
  let done=Object.values(D().slots).filter(Boolean).length;
  let expected=expectedSlotsByNow();
  let paceRatio=expected>0?done/expected:(done>0?1:.6);
  let score=(done/10)*.55+Math.min(paceRatio,1.3)*.45;
  if(done>=4)score+=.15;
  score=clamp(score,0,1.5);
  if(score>=1)return"fire";
  if(score>=.75)return"good";
  if(score>=.45)return"meh";
  return"bad";
}

function ring(pctVal,color,size,stroke,centerLabel){
  size=size||56;stroke=stroke||6;
  let r=(size-stroke)/2,c=2*Math.PI*r,off=c-(clamp(pctVal,0,100)/100)*c;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#eef0f5" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <div class="ringnum" style="color:${color}">${centerLabel!=null?centerLabel:pctVal+"%"}</div>
  </div>`;
}
function arcGauge(pctVal,color,tag){
  const size=190,r=76,cx=92,cy=86,stroke=15;
  const C=2*Math.PI*r, sweep=250, dashLen=C*(sweep/360), gapLen=C-dashLen;
  const valLen=dashLen*(clamp(pctVal,0,100)/100);
  return `<div class="arcwrap">
    <svg width="${size}" height="148" viewBox="0 0 ${size} 148">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#eef0f5" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${dashLen} ${gapLen}" transform="rotate(125 ${cx} ${cy})"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${valLen} ${C-valLen}" transform="rotate(125 ${cx} ${cy})"/>
    </svg>
    <div class="arcnum">${pctVal}%</div>
    <div class="arctag">${tag}</div>
  </div>`;
}
function slotStatusLabel(i,done){
  if(done)return"Done";
  let now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  let [sh,sm]=T[i][0].split(":").map(Number),[eh,em]=T[i][1].split(":").map(Number);
  let s=sh*60+sm,e=eh*60+em;
  if(nowMin<s)return"Upcoming";
  if(nowMin>=s&&nowMin<=e)return"Now";
  return"Missed";
}

  return `<section class="card subjecthero">
    <div style="display:flex;gap:14px;align-items:center">
      <div class="subbadge" style="background:${S[k].c}">${S[k].icon}</div>
      <div><div class="pill prog" style="display:inline-block;margin-bottom:4px">${S[k].short}</div><h2>${S[k].name}</h2><p>${["First coverage","1st revision","2nd revision"][phase]} · ${done}/${n} chapters</p></div>
    </div>
    <div class="phases">${[0,1,2].map(i=>`<i style="${i<=phase?"background:"+S[k].c:""}"></i>`).join("")}</div>
  </section>
  <section class="card section" style="margin-top:14px">
    <div class="head"><h3>${["First coverage","1st revision","2nd revision"][phase]}</h3><span>${done}/${n} complete</span></div>
    <div class="chapters">${S[k].ch.map((c,i)=>`<label class="chapter ${s.p[phase][i]?"done":""}"><input type="checkbox" data-ch="${i}" ${s.p[phase][i]?"checked":""} style="accent-color:${S[k].c}"><span class="cname">${i+1}. ${c[0]}</span><span class="weight">${c[1]}</span></label>`).join("")}</div>
  </section>`;
}

/* ---------------- practice tracker (drawer) ---------------- */
function practiceGrid(){
  return `<div class="practice-grid">${Object.keys(S).map(k=>practiceCard(k)).join("")}</div>`;
}
function practiceCard(k){
  let p=state.subjects[k].practice,t=PRACTICE_TARGET;
  return `<div class="prac"><div class="ptop"><b>${S[k].icon} ${S[k].name}</b><span class="ppct" style="color:${S[k].c}">${practicePctSub(k)}%</span></div>
    ${practiceRow(k,"pyq","PYQ sets",p.pyq,t.pyq)}
    ${practiceRow(k,"mtp","MTPs",p.mtp,t.mtp)}
    ${practiceRow(k,"rtp","RTPs",p.rtp,t.rtp)}
  </div>`;
}
function practiceRow(k,field,label,val,target){
  return `<div class="prow"><div><div class="plabel">${label}</div><div class="ptarget">target ${target}+</div></div>
    <div class="stepper"><button data-dec="${k}:${field}" aria-label="decrease">−</button><span>${val}</span><button data-inc="${k}:${field}" aria-label="increase">+</button></div></div>`;
}

/* ---------------- events ---------------- */
function bind(){
  document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{
    let d=D(),i=b.dataset.slot;
    d.slots["t"+i]=!d.slots["t"+i];save();render();
  });
  document.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>{tab=x.dataset.open;render();scrollTo(0,0)});
  document.querySelectorAll("[data-ch]").forEach(x=>x.onchange=()=>{let s=state.subjects[tab];s.p[s.phase][+x.dataset.ch]=x.checked;adv(tab);save();render()});
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{let [k,f]=b.dataset.inc.split(":");state.subjects[k].practice[f]=clamp((state.subjects[k].practice[f]||0)+1,0,20);save();render()});
  document.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{let [k,f]=b.dataset.dec.split(":");state.subjects[k].practice[f]=clamp((state.subjects[k].practice[f]||0)-1,0,20);save();render()});
  let sl=document.getElementById("saveLog");if(sl)sl.onclick=()=>{let d=D();d.hours=document.getElementById("hours").value;d.chapters=document.getElementById("chapters").value;d.win=document.getElementById("win").value;d.problem=document.getElementById("problem").value;save();render();};
  let c=document.getElementById("clear");if(c)c.onclick=()=>{D().slots={};save();render()};
  let op=document.getElementById("openPractice");if(op)op.onclick=()=>setMenu(true);
  let op2=document.getElementById("openPractice2");if(op2)op2.onclick=()=>setMenu(true);
  let bell=document.getElementById("bellBtn");if(bell)bell.onclick=()=>{tab="home";render();scrollTo(0,0)};
}
function render(){
  navs();
  document.getElementById("app").innerHTML=tab==="home"?home():page(tab);
  document.getElementById("drawerPractice").innerHTML=practiceGrid();
  let leftToday=10-Object.values(D().slots).filter(Boolean).length;
  document.getElementById("bellBadge").textContent=Math.max(0,leftToday);
  bind();
  updateAuthUI();
}

/* ---------------- side menu open/close ---------------- */
function setMenu(open){
  document.getElementById("sideMenu").classList.toggle("open",open);
  document.getElementById("menuOverlay").classList.toggle("open",open);
}
document.getElementById("openMenuSide").onclick=()=>setMenu(true);
document.getElementById("openMenuTop").onclick=()=>setMenu(true);
document.getElementById("closeMenu").onclick=()=>setMenu(false);
document.getElementById("menuOverlay").onclick=()=>setMenu(false);

/* ---------------- auth / cloud sync (unchanged logic) ---------------- */
async function signUp(){
  if(!sb)return alert("Paste your Supabase URL and anon/publishable key into the HTML first.");
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  if(!email||password.length<6)return alert("Enter an email and a password of at least 6 characters.");
  const {error}=await sb.auth.signUp({email,password});
  if(error)return alert(error.message);
  alert("Account created. If email confirmation is enabled in Supabase, confirm your email, then log in.");
}
async function login(){
  if(!sb)return alert("Paste your Supabase URL and anon/publishable key into the HTML first.");
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error)return alert(error.message);
  cloudUser=data.user;updateAuthUI();
  await pullOrPush();
}
async function logout(){if(sb)await sb.auth.signOut();cloudUser=null;updateAuthUI()}
function initials(email){if(!email)return"••";let n=email.split("@")[0];return n.slice(0,2).toUpperCase()}
function updateAuthUI(){
  const dot=document.getElementById("cloudDot"),st=document.getElementById("authStatus"),
        sync=document.getElementById("sync"),logoutBtn=document.getElementById("logout"),loginBtn=document.getElementById("login"),signupBtn=document.getElementById("signup"),
        avatarInit=document.getElementById("avatarInit"),whoName=document.getElementById("whoName"),whoSub=document.getElementById("whoSub");
  if(!SUPABASE_READY){dot.className="cloud-dot warn";st.textContent="Add Supabase keys";sync.style.display="none";logoutBtn.style.display="none";avatarInit.textContent="••";whoName.textContent="Local";whoSub.textContent="no cloud keys";return}
  if(cloudUser){dot.className="cloud-dot on";st.textContent=cloudUser.email||"Cloud account";sync.style.display="inline-block";logoutBtn.style.display="inline-block";loginBtn.style.display="none";signupBtn.style.display="none";
    avatarInit.textContent=initials(cloudUser.email);whoName.textContent=(cloudUser.email||"Account").split("@")[0];whoSub.textContent="synced"}
  else{dot.className="cloud-dot";st.textContent="Not logged in";sync.style.display="none";logoutBtn.style.display="none";loginBtn.style.display="inline-block";signupBtn.style.display="inline-block";
    avatarInit.textContent="••";whoName.textContent="Local";whoSub.textContent="tap to sync"}
}
async function pullOrPush(){
  if(!sb||!cloudUser)return;
  const {data,error}=await sb.from("tracker_state").select("state,updated_at").eq("user_id",cloudUser.id).maybeSingle();
  if(error)return alert("Cloud read failed: "+error.message);
  if(data && data.state && Object.keys(data.state).length){
    const useCloud=confirm("Cloud progress found. Load cloud progress and replace this device's local tracker?");
    if(useCloud){state=data.state;if(typeof state.streakRecord!=="number")state.streakRecord=0;save();render();setCloudStatus("Cloud loaded");}
    else{await pushCloud();setCloudStatus("Local kept")}
  }else{
    await pushCloud();
    setCloudStatus("Local progress uploaded");
  }
}
async function pushCloud(){
  if(!sb||!cloudUser)return;
  const {error}=await sb.from("tracker_state").upsert({user_id:cloudUser.id,state,updated_at:new Date().toISOString()},{onConflict:"user_id"});
  if(error)return alert("Cloud sync failed: "+error.message);
  setCloudStatus("Synced just now");
}
function setCloudStatus(t){const st=document.getElementById("authStatus");if(cloudUser)st.textContent=t}
document.getElementById("signup").onclick=signUp;
document.getElementById("login").onclick=login;
document.getElementById("logout").onclick=logout;
document.getElementById("sync").onclick=pushCloud;

if(sb){
  sb.auth.getSession().then(async ({data})=>{cloudUser=data.session?.user||null;updateAuthUI();if(cloudUser)await pullOrPush()});
  sb.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;updateAuthUI()});
}else updateAuthUI();

render();
</script>
